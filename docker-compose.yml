# ==================== 本地生产形态编排 ====================
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: voloi
      POSTGRES_USER: voloi
      POSTGRES_PASSWORD: voloi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voloi -d voloi"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://voloi:voloi@postgres:5432/voloi
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  postgres_data:
